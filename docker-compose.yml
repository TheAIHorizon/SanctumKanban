services:
  db:
    image: postgres:16-alpine
    container_name: sanctum-kanban-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sanctum_kanban}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ${KANBAN_IMAGE:-sanctumkanban-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sanctum-kanban-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sanctum_kanban}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3456}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      PORT: 3456
      # Provider-agnostic AI (optional). From a container, a host Ollama is at
      # host.docker.internal. Falls back to keyword search when unset/unreachable.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_COACH_MODEL: ${AI_COACH_MODEL:-laguna-s}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "3456:3456"

  # Explicitly opt in after approving the schema/update and enabling classes.
  # This worker has no published ports and never runs schema synchronization.
  reviewer:
    image: ${KANBAN_IMAGE:-sanctumkanban-app:latest}
    profiles: ["nightly"]
    restart: unless-stopped
    entrypoint: []
    command: ["npm", "run", "review:nightly", "--", "--daemon"]
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
      NIGHTLY_REVIEW_RUNNER: "1"

volumes:
  postgres_data:
